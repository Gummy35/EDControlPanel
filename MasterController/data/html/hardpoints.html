<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Dangerous Controller - WiFi Setup</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    function deleteHardpoint(id) {
      if (confirm('Are you sure you want to delete this hardpoint?')) {
        fetch(`/deletehardpoint?id=${id}`, { method: 'POST' })
          .then(response => response.text())
          .then(data => alert(data))
          .catch(error => console.error('Error:', error));
      }
    }
  </script>
</head>

<body>
  <div class="logo-container">
    <img src="/static/logo_50.png" alt="Logo" class="logo">
    <div class="overlay-text">Controller</div>
  </div>
  <div class="scanlines">
    <div class="menu-bar">
      <div class="menu-item">
        <a href="/update">Update Firmware</a>
      </div>
      <div class="menu-item">
        <a href="/webserial">Web Serial Console</a>
      </div>
      <div class="menu-item">
        <a href="#">Settings</a>
        <div class="submenu">
          <div class="scanlines crt-colorsep">
            <a href="/wifi">Wifi</a>
            <a href="/mapping">Keys mapping</a>
            <a href="/hardpoints">Hardpoints</a>
            <a href="/macros">Macros</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="container-hp" class="container">
    <h2>Hardpoints Configuration</h1>

      <form action="/savehardpoints" method="POST">
        <label for="fireGroupCount">Fire Group Count:</label>
        <input type="number" id="fire_group_count" name="fire_group_count" value="%FIRE_GROUP_COUNT%" min="1" max="10"
          required>

        <h2>Hardpoints</h2>
        <div class="header-row">
          <div>Hardpoint ID</div>
          <div>Fire Group</div>
          <div>Fire Weapon</div>
          <div>HUD Mode</div>
          <div>Actions</div>
        </div>

        <div id="hardpoints">
          %HARDPOINTS%
        </div>

        <div class="hardpoint-row">
          <div>
            <select name="hardpoint_id">
              <option value="72">DSD Scanner</option>
              <!--option value="73">ACS Scanner</option-->
            </select>
          </div>
          <div>
            <input type="number" name="fire_group" value="1" min="1" max="10">
          </div>
          <div>
            <select name="fire_weapon">
              <option value="1" selected>Primary</option>
              <option value="2">Secondary</option>
            </select>
          </div>
          <div>
            <select name="analysis_mode">
              <option value="0">Combat</option>
              <option value="1" selected>Analysis</option>
            </select>
          </div>
          <div>
            <button type="submit">Save</button>
          </div>
        </div>
      </form>
  </div>

</body>

</html>
